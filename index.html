<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VibDocs</title>
    <script>
      // Aplica o tema antes de desenhar a página (evita piscar no tema errado).
      try {
        var m = localStorage.getItem('vibdocs.tema') || 'sistema'
        var escuro = m === 'escuro' || (m === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
      } catch (e) {}
    </script>
      <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icone-192.png" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
